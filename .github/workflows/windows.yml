# TEMPORARY: trimmed to debug the vesin/DeePMD-kit import failure on Windows.
# All test runs except the DeePMD-kit one are disabled; the uv syncs are kept so
# the final environment resolves exactly as it does on a normal run.
# Revert this file before merging.
name: windows-ci

on: [push, pull_request]

jobs:

  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11","3.12","3.13"]

    # Use non-interactive backend for plotting
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          prune-cache: false

      - name: Install "all" dependencies
        run: uv sync --extra chgnet --extra d3 --extra grace --extra mace

      - name: Download extra models
        shell: bash
        run: |
          python3 tests/models/extra_models.py tests/models/extra

      # TEMPORARY: disabled while debugging vesin
      # - name: Run test suite
      #   env:
      #     # show timings of tests
      #     PYTEST_ADDOPTS: "--durations=0"
      #   run: uv run --no-sync pytest

      - name: Install updated e3nn dependencies
        run: |
          uv sync --extra fairchem --extra sevennet --extra nequip
          uv pip install --reinstall pynvml
          uv pip install "fairchem-core[torch-extras]" --no-build-isolation

      # TEMPORARY: disabled while debugging vesin
      # - name: Run test suite for updated e3nn dependencies
      #   env:
      #     # show timings of tests
      #     PYTEST_ADDOPTS: "--durations=0"
      #     HF_TOKEN: ${{ secrets.HF_TOKEN }}
      #   run: uv run --no-sync pytest tests/test_mlip_calculators.py tests/test_single_point.py

      - name: Install DeePMD-kit (incompatible with MACE and fairchem)
        run: uv sync --extra deepmd

      # TEMPORARY: surfaces the ImportError that deepmd's is_vesin_torch_available swallows
      - name: Diagnose vesin import
        continue-on-error: true
        shell: bash
        run: |
          uv pip list | grep -Ei "vesin|^torch "
          uv run --no-sync python - <<'PY'
          import importlib, traceback
          for name in ("torch", "vesin", "vesin_torch", "vesin.torch"):
              try:
                  mod = importlib.import_module(name)
                  print(f"OK    {name} {getattr(mod, '__version__', '')}", flush=True)
              except Exception:
                  print(f"FAIL  {name}", flush=True)
                  traceback.print_exc()
          PY

      - name: Run test suite for DeePMD-kit
        env:
          # show timings of tests
          PYTEST_ADDOPTS: "--durations=0"
        run: uv run --no-sync pytest tests/test_single_point.py -k deepmd
